# CI — ENCReload (the MOD).
#
# 2026-08-24: this workflow used to run the editor guards — the ownership hand-list gate and the cross-repo registry
# schema parity check. Both guarded the AUTHORING TOOLS, and the tools moved to the HumankindAssetFramework repo's
# editor/ (consumed back here as a Unity package). The guards moved with their source, so they now run in that
# repo's CI, where the files they read actually live — and parity stopped being cross-repo at all, because both
# halves of the contract are in one tree now.
#
# What is left in this repo is the mod's CONTENT: game data, the pack, skins, sounds, and the Blender/model-prep
# scripts under Tools/. None of it is source-only checkable on a hosted runner today; the things that verify it
# need Unity, Blender or the game (deploy_regression.sh, the in-editor Feature Test, an in-game load).
#
# The one coupling the move introduced — that Packages/manifest.json's file: dependency resolves to a real checkout
# — is deliberately NOT checked here: a file: path points at a sibling folder on a developer machine, which a
# runner does not have. Tools/check.sh checks it in the pre-push hook, which is where that path is real.
#
# Kept as a stub rather than deleted so the branch protection and the workflow name survive, and so the reason is
# recorded where somebody looking for the missing guards will find it.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Where the editor guards went
        run: |
          echo "The editor guards moved to sswelm/HumankindAssetFramework (tools/check_handlists.sh,"
          echo "tools/check_schema_parity.sh, tools/editor_compile_check.sh) along with the tools they guard."
          echo "This repo now consumes them as the com.sswelm.haf-authoring package."
